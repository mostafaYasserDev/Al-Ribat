name: al_ribat
description: Prayer-centered productivity app.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  geolocator: ^12.0.0
  adhan: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  google_fonts: ^6.2.1
  file_picker: ^8.1.4
  share_plus: ^10.1.4
  flutter_foreground_task: ^9.2.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  local_auth: ^3.0.1
  flutter_slidable: ^4.0.3
  confetti: ^0.8.0
  home_widget: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: icon.png
  adaptive_icon_foreground: icon.png
  adaptive_icon_background: "#0F3D2E"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/developer/
    - assets/app_icon.png
